# Pre-shared HMAC secrets, keyed by client_id. In a real deployment these
# would come from a provisioning/enrollment process (out of scope here).
# NOTE: proxy.py only needs the flat {client_id: secret} mapping, so it
# reads the "secrets" section below. Clients read "clients" to know both
# their secret and their asserted role when building their own token.
secrets:
  sensor-01: "s3nsor-secret-01"
  sensor-02: "s3nsor-secret-02"
  aggregator-01: "aggr-secret-01"
  dashboard-01: "dash-secret-01"
  attacker-01: "wrong-or-unknown-secret"   # used in attack-scenario tests

clients:
  sensor-01: {secret: "s3nsor-secret-01", role: sensor}
  sensor-02: {secret: "s3nsor-secret-02", role: sensor}
  aggregator-01: {secret: "aggr-secret-01", role: aggregator}
  dashboard-01: {secret: "dash-secret-01", role: dashboard}
  attacker-01: {secret: "wrong-or-unknown-secret", role: admin}   # claims admin, wrong secret -> should be rejected

